name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'tstory_backend/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.short_sha }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tstory_backend/package-lock.json

      - name: 의존성 설치 및 빌드
        working-directory: tstory_backend
        run: |
          npm ci
          npm run build

      - name: 이미지 태그 생성
        id: meta
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: tstory_backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tstory-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tstory-backend:${{ steps.meta.outputs.short_sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: SSH로 Lightsail 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 최신 이미지 풀
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/tstory-backend:latest

            # 기존 컨테이너 중지 및 삭제
            docker stop tstory-backend 2>/dev/null || true
            docker rm tstory-backend 2>/dev/null || true

            # 새 컨테이너 실행
            docker run -d \
              --name tstory-backend \
              --restart unless-stopped \
              -p 3010:3010 \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
              -e ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
              -e KAKAO_EMAIL="${{ secrets.KAKAO_EMAIL }}" \
              -e KAKAO_PASSWORD="${{ secrets.KAKAO_PASSWORD }}" \
              -e TISTORY_BLOG_NAME="${{ secrets.TISTORY_BLOG_NAME }}" \
              -e PORT=3010 \
              -e NODE_ENV=production \
              -e BROWSERBASE_ENABLED=true \
              -e BROWSERBASE_API_KEY="${{ secrets.BROWSERBASE_API_KEY }}" \
              -e BROWSERBASE_PROJECT_ID="${{ secrets.BROWSERBASE_PROJECT_ID }}" \
              -e AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
              -e AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
              -e AWS_REGION=ap-northeast-2 \
              -e AWS_S3_BUCKET=space0101-images \
              -e CREDENTIAL_ENCRYPTION_KEY="${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}" \
              -e NEXT_PUBLIC_FRONTEND_URL="${{ secrets.NEXT_PUBLIC_FRONTEND_URL }}" \
              -e ADMIN_EMAILS="${{ secrets.ADMIN_EMAILS }}" \
              ${{ secrets.DOCKERHUB_USERNAME }}/tstory-backend:latest

            # 미사용 이미지 정리
            docker image prune -f
